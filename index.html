function setField(el) {
  const val = el.hasAttribute('data-num') ? +el.value : el.value;
  if (el.dataset.school) S[el.dataset.school] = val;
  else if (el.dataset.time) { const [i, j] = el.dataset.time.split('|'); S.times[i][j] = val; }
  else {
    const [coll, id, field] = el.dataset.f.split('|'); const o = S[coll].find(x => x.id === id); if (o) o[field] = val;
    // мұғалімнің аты өзгерсе — ол жүргізетін үйірмелердегі аты да өзгереді
    if (coll === 'teachers' && field === 'name') (S.clubs?.groups || []).forEach(g => { if (g.tid === id) g.teacher = val; });
  }
}

function action(act, ds) {
  const id = ds.id;
  const dropL = fn => { for (const k in S.sched) { S.sched[k] = S.sched[k].filter(x => !fn(k, x)); if (!S.sched[k].length) delete S.sched[k]; } };
  switch (act) {
    case 'addTime': { const last = S.times[S.times.length - 1] || ['08:00', '08:40']; S.times.push([last[1], last[1]]); commit(); break; }
    case 'delTime': { const L = S.times.length - 1; S.times.pop(); dropL(k => +k.split('|')[2] >= L); commit(); break; }
    case 'addClass': { const nid = uid(); S.classes.push({ id: nid, name: 'Жаңа', grade: 1, room: '', lang: 'kz' }); S.plan[nid] = { max: S.times.length, rows: [] }; commit(); break; }
    case 'delClass': ask(`«${esc(cls(id).name)}» сыныбын және оның кестесін жою керек пе?`, () => {
      S.classes = S.classes.filter(c => c.id !== id); S.teachers.forEach(t => { if (t.cls === id) t.cls = ''; }); dropL(k => k.startsWith(id + '|')); delete S.plan[id]; commit(); }); break;
    case 'addSubj': S.subjects.push({ id: uid(), name: 'Жаңа пән', color: '#' + (0x1000000 + Math.floor(Math.random() * 0xffffff)).toString(16).slice(1) }); commit(); break;
    case 'delSubj': ask(`«${esc(subj(id).name)}» пәнін жою керек пе? Кестедегі осы пәннің барлық сабақтары өшіріледі.`, () => {
      S.subjects = S.subjects.filter(s => s.id !== id); S.teachers.forEach(t => t.subjects = t.subjects.filter(s => s !== id)); dropL((k, x) => x.s === id);
      for (const c in S.plan) S.plan[c].rows = S.plan[c].rows.filter(r => r.s !== id); commit(); }); break;
    case 'addTeacher': S.teachers.push({ id: uid(), name: 'Жаңа мұғалім', subjects: [], cls: '', room: '' }); commit(); break;
    case 'delTeacher': removeTeacher(id); break;
    case 'manual': manual = !manual; brush = null; render(); break;
    case 'clearClass': ask(`${esc(cls(curClass).name)} сыныбының барлық сабақтары (бекітілгендерден басқа) өшіріледі. Кейін «✋ Қолмен құру» арқылы қайта қоясыз. Жалғастырамыз ба?`, () => {
      for (const k in S.sched) if (k.startsWith(curClass + '|')) { S.sched[k] = S.sched[k].filter(x => subj(x.s)?.fixed); if (!S.sched[k].length) delete S.sched[k]; }
      commit(); }); break;
    case 'tsubDel': { const t = teacher(id); t.subjects = t.subjects.filter(s => s !== ds.s); commit(); break; }
    case 'plAdd': planOf(curClass).rows.push({ id: uid(), s: '', h: 1, items: [{ t: '', r: cls(curClass).room || '', g: '' }] }); save(); render(); break;
    case 'plDel': { const P = planOf(curClass); P.rows = P.rows.filter(r => r.id !== id); save(); render(); break; }
    case 'plAddItem': { const r = planOf(curClass).rows.find(x => x.id === id);
      r.items.forEach((it, i) => { if (!it.g) it.g = (i + 1) + ' группа'; }); r.items.push({ t: '', r: '', g: (r.items.length + 1) + ' группа' }); save(); render(); break; }
    case 'plDelItem': { const r = planOf(curClass).rows.find(x => x.id === id); r.items.splice(+ds.i, 1); if (r.items.length === 1) r.items[0].g = ''; save(); render(); break; }
    case 'plRebuild': ask(`${esc(cls(curClass).name)} сыныбының жоспары қазіргі кестедегі сабақтар бойынша қайта жасалады. Жалғастырамыз ба?`, () => { S.plan[curClass] = buildPlan(curClass); save(); render(); }); break;
    case 'plCopy': {
      const to = $('#plCopyTo').value; if (!to) { toast('Алдымен қай сыныпқа көшіретініңізді таңдаңыз'); break; }
      const from = cls(curClass), tc = cls(to), hrF = homeroom(from.id), hrT = homeroom(to);
      ask(`${esc(from.name)} жоспары ${esc(tc.name)} сыныбына көшіріледі (сынып жетекшісі мен сынып кабинеті ауыстырылады). Жалғастырамыз ба?`, () => {
        const P = clone(planOf(from.id)); P.rows.forEach(r => { r.id = uid(); r.items.forEach(it => {
          if (hrF && hrT && it.t === hrF.id) it.t = hrT.id; if (from.room && nr(it.r) === nr(from.room)) it.r = tc.room || ''; }); });
        S.plan[to] = P; curClass = to; save(); render(); toast('✓ Жоспар көшірілді', true); });
      break;
    }
    case 'autofill': runAutofill(); break;
    case 'clubMapApply': S.clubs.groups.forEach(g => { if (!g.ov && S.clubs.map[g.ol] !== undefined) g.p = S.clubs.map[g.ol]; }); commit(); toast('✓ Үйірме сабақтарының уақыты жаңартылды', true); break;
    case 'clubRefresh': refreshClubs(); break;
    case 'kidNew': newKid(); break;
    case 'linksShow': loadLinks(false); break;
    case 'webZip': webZip(); break;
    case 'subAdd': { const tid = $('#sbT').value, from = $('#sbF').value, days = Math.max(1, +$('#sbN').value || 1);
      if (!tid || !from) { toast(T('Мұғалім мен басталатын күнді таңдаңыз', 'Выберите учителя и дату начала')); break; }
      S.subs.list.push({ id: uid(), tid, from, days, note: $('#sbNote').value.trim(), pick: {} }); commit(); toast(T('✓ Ауыстыру қосылды — бос мұғалімдер қойылды', '✓ Замена добавлена — свободные учителя назначены'), true); break; }
    case 'subDel': ask(T('Бұл ауыстыруды жою керек пе?', 'Удалить эту замену?'), () => { S.subs.list = S.subs.list.filter(a => a.id !== id); commit(); }); break;
    case 'subCur': S.subs.curators = $('#sbCur').value.split('\n').map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean); commit(); toast(T('✓ Кураторлар сақталды', '✓ Кураторы сохранены'), true); break;
    case 'webRenew': ask(T('Барлық ескі сілтеме жабылып, жаңалары жасалады. Жаңа сілтемелерді бәріне қайта жіберу керек. Жалғастырамыз ба?', 'Все старые ссылки закроются, будут созданы новые. Новые ссылки нужно будет разослать заново. Продолжить?'), () => { webEnsure(true); save(); render(); toast(T('✓ Жаңа сілтемелер жасалды', '✓ Новые ссылки созданы'), true); }); break;
    case 'linksRenew': ask('Барлық ескі сілтеме (мұғалімдердікі де, ата-аналардікі де) жабылып, жаңалары жасалады. Жаңа сілтемелерді бәріне қайта жіберуге тура келеді. Жалғастырамыз ба?', () => loadLinks(true)); break;
    case 'pwChange': changePw(); break;
    case 'clear': ask('Барлық сабақтарды кестеден өшіру керек пе?', () => { S.sched = {}; commit(); }); break;
    case 'reset': if (!INITIAL) { toast('Бұл батырма тек компьютердегі нұсқада жұмыс істейді'); break; } ask('Барлық өзгерістер өшіріліп, мектептің бастапқы кестесі (PDF) мен үйірмелер қайта жүктеледі. Жалғастырамыз ба?', () => { S = clone(INITIAL); ensure(); prevConf = new Set(); tab = 'all'; commit(); }); break;
    case 'export': download(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }), 'sabak-kestesi.json'); break;
    case 'import': $('#fileIn').click(); break;
  }
}
$('#fileIn').onchange = e => {

    catch (err) { toast('Файл қате: сабақ кестесінің JSON файлы емес'); }

/* Сүйреп орнын ауыстыру (бір сынып ішінде, тек админ) */
main.addEventListener('dragstart', e => { const c = e.target.closest('.cell[draggable]'); if (!c || !isAdmin) return; dragK = c.dataset.k; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragK); });
main.addEventListener('dragover', e => { const c = e.target.closest('.cell[data-k]'); if (c && dragK) { e.preventDefault(); document.querySelectorAll('.cell.over').forEach(x => x !== c && x.classList.remove('over')); c.classList.add('over'); } });
main.addEventListener('dragleave', e => { const c = e.target.closest('.cell[data-k]'); if (c && !c.contains(e.relatedTarget)) c.classList.remove('over'); });
main.addEventListener('dragend', () => { dragK = null; document.querySelectorAll('.cell.over').forEach(x => x.classList.remove('over')); });
main.addEventListener('drop', e => {
  const c = e.target.closest('.cell[data-k]'); if (!c || !dragK) return; e.preventDefault();
  const k = c.dataset.k, from = dragK; dragK = null;
  if (k === from) { render(); return; }
  if (k.split('|')[0] !== from.split('|')[0]) { render(); toast('Сабақты тек бір сыныптың ішінде жылжытуға болады'); return; }
  const a = S.sched[from], b = S.sched[k];
  if (b) S.sched[from] = b; else delete S.sched[from];
  if (a) S.sched[k] = a; else delete S.sched[k];
  commit();
});

/* ---------- Іске қосу ---------- */
function start(p) {
  ensure();
  computeConflicts();
  prevConf = new Set(Object.keys(C.les));
  if (['all', 'class', 'teacher', 'room', 'clubs', 'subs', 'plan', 'settings'].includes(location.hash.slice(1))) tab = location.hash.slice(1);
  applyParams(p || {});
  $('#loadScr').hidden = true;
  render();
  if (PARENT) return;
  // сессия ішінде админ болып қалу
  let pw = ''; try { pw = sessionStorage.getItem('sabak-adm') || ''; } catch (e) {}
  if (pw) verifyPw(pw).then(ok => { if (ok) { isAdmin = true; adminPw = pw; render(); } }).catch(() => {});
}
function startParent(cname) {
  PARENT = true; document.body.classList.add('parent');
  const c = S.classes.find(x => x.name === cname) || S.classes[0];
  PCLASS = c.id; curClass = c.id; clubMode = 'class'; clubCls = c.name; tab = 'class';
  start({});
  UI = PICK || clsLang(c.id); render();
}
/* Google-дағы файлда бастапқы кесте жоқ (файл кішірек болуы үшін) — деректер тек серверден келеді */
function noData(msg) {
  $('#main').setAttribute('data-ok', '1'); $('#loadScr').hidden = true;
  $('#main').innerHTML = `<div class="card" style="max-width:720px;margin:30px auto"><h2>Кесте деректері серверден алынбады</h2><p>${esc(msg || 'Серверде сақталған кесте табылмады.')}</p><p class="hint">Бетті Ctrl+F5 арқылы жаңартып көріңіз. Қайталанса — компьютердегі сайттан «Баптаулар → ⬇ Экспорт (JSON)» жасап, файлды маған жіберіңіз.</p></div>`;
}
/* Код.gs ескі болып қалса — бос беттің орнына не істеу керегін көрсету */
function showSetupError() {
  $('#main').setAttribute('data-ok', '1');
  document.querySelector('nav').hidden = true; document.querySelector('.hbtns').hidden = true;
  $('#schoolName').textContent = 'Baiterek School of Science and Technology'; $('#schoolSub').textContent = SUBTITLE;
  $('#foot').textContent = 'Сайт: ' + APP_VERSION;
  $('#main').innerHTML = `<div class="card" style="max-width:720px;margin:30px auto"><h2>⚙️ Сайт серверде толық орнатылмаған</h2>
    <p>Сайттың жаңа нұсқасы жүктелді, бірақ script.google.com ішіндегі <b>Код.gs</b> файлы әлі ескі.</p>
    <ol><li>script.google.com → жоба → сол жақтағы <b>Код.gs</b> → ішін басып <b>Ctrl+A</b> → <b>Delete</b>.</li>
      <li>Компьютердегі «Сайтқа орнату (Google)» қалтасындағы <b>Code.gs</b> файлын Блокнотпен ашып → <b>Ctrl+A</b> → <b>Ctrl+C</b> → script.google.com ішіне <b>Ctrl+V</b> → <b>Ctrl+S</b>.</li>
      <li><b>Развернуть</b> → <b>Управление развертываниями</b> → ✏️ → Версия: <b>«Новая версия»</b> → <b>Развернуть</b>.</li>
      <li>Осы бетті <b>Ctrl+F5</b> арқылы жаңартыңыз.</li></ol>
    <p class="hint">Кесте деректері сақтаулы — ештеңе жоғалған жоқ.</p></div>`;
}
if (STATIC) {
  document.body.classList.add('static'); $('#loadScr').hidden = false;
  readParams(p => {
    const tok = String(p.k || p.t || '').replace(/[^0-9a-z]/gi, '');
    if (!tok) return showDenied();
    // деректер Google-дан кілт бойынша тікелей алынады (GitHub Pages-те деректер файлдары жоқ); Netlify-дағы ескі нұсқа — <кілт>.json
    const get = u => fetch(u, { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    get(DATA_API + '?api=1&' + (p.k ? 'k=' : 't=') + tok).then(j => { if (!j || !j.ok) throw new Error(j && j.error); return j.data; })
      .catch(() => get(tok + '.json')).catch(() => get('d/' + tok + '.json'))
      .then(x => { S = x; if (p.k) startParent(S.classes[0].name); else start(p); })
      .catch(() => showDenied());
  });
} else if (BUILD === 'broken') showSetupError();
else if (SERVER) {
  $('#loadScr').hidden = false;
  readParams(p => {
    if (BUILD === 'denied') return showDenied();
    if (BUILD === 'parent') {   // ата-ана: сервер тек осы сыныптың деректерін береді
      google.script.run
        .withSuccessHandler(txt => { S = JSON.parse(txt); startParent(S.classes[0].name); })
        .withFailureHandler(e => showDenied(e && e.message))
        .getParentData(p.k);
      return;
    }
    STAFF = p.s || '';
    google.script.run
      .withSuccessHandler(txt => { try { S = txt ? JSON.parse(txt) : clone(INITIAL); } catch (e) { S = clone(INITIAL); } if (!S) return noData(); start(p); })
      .withFailureHandler(e => { S = clone(INITIAL); if (!S) return noData(e && e.message); start(p); toast('Серверден деректер алынбады: ' + (e && e.message || e)); })
      .getData(STAFF);
  });
} else {
  S = loadLocal() || clone(INITIAL);
  readParams(start);
}
</script>
</body>
</html>
