<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сабақ кестесі — Baiterek School of Science and Technology</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e3e7ef;--accent:#2563eb;--red:#ff1a1a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:14px/1.35 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(120deg,#1e3a8a,#2563eb 60%,#0ea5e9);color:#fff;padding:16px 20px 12px}
.hwrap{max-width:1800px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:23px;letter-spacing:.2px}
header .sub{opacity:.92;margin-top:3px;font-size:14px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hbtn{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.22)}
.hbtn.bad{background:var(--red);border-color:#fff;animation:pulse 1s infinite}
.hbtn.good{background:rgba(22,163,74,.85)}
.hbtn.adm{background:#facc15;color:#1f2937;border-color:#facc15;font-weight:700}
.sstate{font-size:12.5px;opacity:.95}
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15}
.nwrap{max-width:1800px;margin:0 auto;display:flex;gap:4px;padding:0 12px;overflow-x:auto}
nav button{border:0;background:none;font:inherit;font-weight:600;color:var(--muted);padding:12px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
body:not(.admin) .admonly{display:none!important}
body.static #loginBtn{display:none!important}
body.parent nav button:not([data-tab="class"]):not([data-tab="clubs"]),body.parent #loginBtn,body.parent .pall{display:none!important}
.plink{display:flex;gap:6px;align-items:center;margin:3px 0}
.plink input{flex:1;font-size:12.5px;color:#334155;background:#f8fafc}
main{max-width:1800px;margin:0 auto;padding:14px 16px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.bar h2{margin:0 8px 0 0;font-size:18px}
.hint{color:var(--muted);font-size:13px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font:inherit;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
select,input,textarea{font:inherit;border:1px solid #cfd6e3;border-radius:8px;padding:6px 8px;background:#fff;color:inherit;max-width:100%}
input[type=color]{padding:2px;width:42px;height:32px}
.tw{overflow:auto;max-height:78vh;background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
table.tt{border-collapse:separate;border-spacing:3px}
.tt thead th{position:sticky;top:0;z-index:4;background:#e8eefb;color:#334155;font-weight:700;padding:7px 6px;border-radius:8px;text-align:center;white-space:nowrap}
.tt thead th:first-child,.tt thead th.stk2{left:0;z-index:6}
.tt thead th.stk2{left:41px}
.tt td.day{position:sticky;left:0;z-index:3;background:#1e3a8a;color:#fff;font-weight:700;text-align:center;border-radius:8px;padding:6px 4px;letter-spacing:1px;width:38px;min-width:38px}
.tt td.day span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block}
.tt td.num{position:sticky;left:41px;z-index:3;background:#e8eefb;text-align:center;font-weight:700;border-radius:8px;padding:3px 5px;white-space:nowrap;box-shadow:3px 0 0 var(--card)}
.tt.cls td.num{left:0}
.tt.cls{width:100%;table-layout:fixed}
.tt.cls th:first-child{width:96px}
.tt td.num small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.tt tr.dsep td{height:8px;padding:0;background:none}
.cell{min-width:128px;height:60px;padding:0;border-radius:8px;vertical-align:top}
body.admin .cell{cursor:pointer}
.cell.empty{background:#fafbfd;border:1px dashed #d5dbe6;text-align:center;vertical-align:middle;color:#c1c8d4}
.cell.over{outline:3px dashed var(--accent)}
.cell.busy{background:repeating-linear-gradient(45deg,#eef1f5,#eef1f5 5px,#dfe4ec 5px,#dfe4ec 10px);border:1px dashed #b6bfcd}
.cell.ok{outline:2px dashed #16a34a;outline-offset:-3px;background:#f0fdf4}
.manual{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.manual .chip{display:inline-flex;gap:6px;align-items:center;margin:2px}
.chip.brush{background:var(--c);color:var(--tc);border:2px solid transparent}
.chip.brush.on{border-color:#111827;box-shadow:0 0 0 3px #facc15}
.chip.brush small{opacity:.85}
.chip.brush.full{opacity:.55}
.help h3{margin:14px 0 4px;font-size:15px}
.help ol{margin:4px 0;padding-left:22px}
.help li{margin:2px 0}
.lw{display:flex;gap:2px;height:100%;min-height:60px}
.les{--c:#cbd5e1;flex:1;min-width:0;background:var(--c);color:var(--tc,#111827);border-radius:7px;padding:4px 6px;overflow:hidden}
body.admin .cell:hover .les{filter:brightness(.95)}
.les .sn{font-weight:700;font-size:12.5px;line-height:1.2}
.les .gn,.les .tn,.les .rn{opacity:.88}
.les .gn{font-size:10.5px}
.les .tn{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.les .rn{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.les.split .sn{font-size:11.5px}
.les.club{cursor:pointer}
.les.conflict{background:var(--red)!important;color:#fff!important;outline:3px solid #ffd60a;outline-offset:-3px;animation:pulse .9s infinite}
.les.ext{background:repeating-linear-gradient(135deg,#e2e8f0,#e2e8f0 6px,#cbd5e1 6px,#cbd5e1 12px);color:#1f2937}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,26,26,.35);filter:brightness(1.15)}}
.tcell{min-width:150px;height:60px;vertical-align:top;padding:0;border-radius:8px}
.tcell.free{background:#fafbfd;border:1px dashed #e1e6ee}
.tcell .les{margin-bottom:2px}
.tcell.mx{min-width:132px;width:132px}
.tt th.pick{cursor:pointer;text-decoration:underline dotted;max-width:140px;white-space:normal;line-height:1.15}
.tt th.pick:hover{background:#dbe5fb;color:var(--accent)}
body.admin .tcell [data-k] .les{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.lg{display:flex;gap:6px;align-items:center;background:#fff;border-radius:999px;padding:3px 10px 3px 4px;border:1px solid var(--line);font-size:12.5px}
.lg i{width:15px;height:15px;border-radius:50%;background:var(--c);display:inline-block}
.lg.red i{background:var(--red)}
.info{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{background:var(--c,#fff);color:var(--tc,#1f2937);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);min-width:0}
.card.wide{grid-column:1/-1}
.card h2{margin:0 0 12px;font-size:17px}
.card label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.card label input,.card label select,.card label textarea{color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.card label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.scroll{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.st{border-collapse:collapse;width:100%}
.st th{position:sticky;top:0;background:#f8fafc;text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 4px;z-index:1}
.st td{padding:4px;vertical-align:middle;border-top:1px solid #f1f5f9}
.st input.w{width:100%}
.st td.miss{background:#fffbeb;color:#b45309;font-weight:700}
.st td.ok{color:#15803d;font-weight:700}
.tchips{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.tchip{--c:#ccc;background:var(--c);color:var(--tc,#111);border-radius:999px;padding:2px 4px 2px 8px;font-size:12px;display:inline-flex;gap:4px;align-items:center}
.tchip button{border:0;background:none;cursor:pointer;color:inherit;font-size:12px;padding:0 3px;opacity:.8}
.tchips select{font-size:12px;padding:2px 4px;width:110px}
.btn{border:1px solid #cfd6e3;background:#fff;border-radius:9px;padding:7px 13px;font:inherit;cursor:pointer;font-weight:600}
.btn:hover{background:#f1f5f9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1d4ed8}
.btn.danger{color:#be123c;border-color:#fecdd3}
.btn.sm{padding:4px 9px;font-size:13px}
.x{border:0;background:#fff1f2;color:#be123c;border-radius:8px;width:28px;height:28px;cursor:pointer;font-weight:700}
.dbtns{display:flex;flex-wrap:wrap;gap:8px}
.dl{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.pli{display:flex;gap:4px;align-items:center;margin-bottom:3px;flex-wrap:wrap}
.pli select{width:230px}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md{background:#fff;border-radius:16px;padding:20px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.md h3{margin:0 0 12px;font-size:18px}
.md h3 small{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
.md label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.md label select,.md label input{color:var(--ink);width:100%}
.eb{border:1px solid var(--line);border-left:6px solid var(--c,#cbd5e1);border-radius:10px;padding:10px;margin-bottom:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eb label{margin:0}
.eb .full{grid-column:1/-1}
.ebh{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.mbtns{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.warn{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:4px}
.warn:empty{display:none}
.clist{list-style:none;margin:0;padding:0}
.clist li{padding:8px 10px;border-radius:8px;background:#fff1f2;margin-bottom:6px;border-left:4px solid var(--red);font-size:13px}
.clist b{color:#9f1239}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#dc2626;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:30;max-width:min(600px,92vw);font-weight:600}
.toast.okt{background:#0f766e}
.pbar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.ul{margin:6px 0 0;padding-left:18px;max-height:300px;overflow:auto;font-size:13px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.gcard{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);overflow:hidden;display:flex;flex-direction:column}
.gcard.bad{outline:3px solid var(--red)}
.gh{padding:10px 12px;color:#fff}
.gh b{font-size:15px}
.gh .gm{font-size:12.5px;opacity:.92;margin-top:2px}
.gb{padding:8px 12px 10px;font-size:13px;flex:1}
.gb ol{margin:4px 0 0;padding-left:26px;columns:2;column-gap:16px}
.gb li{break-inside:avoid;padding:1px 0}
.gb li.bad{color:#fff;background:var(--red);border-radius:4px;padding:0 4px}
.gb .kc{color:var(--muted);font-size:12px}
.gf{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap}
mark{background:#fde047;border-radius:3px}
.sbox{position:relative;display:inline-flex;align-items:center;flex:1;max-width:460px;min-width:260px}
.sbox::before{content:'🔍';position:absolute;left:11px;font-size:15px;pointer-events:none;opacity:.75}
.sbox input{width:100%;padding:8px 10px 8px 36px;border-radius:999px;border-color:#94a3b8}
.sbox input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.kcard{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:12px;overflow:hidden;max-width:900px}
.kcard .kh{background:#1e3a8a;color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.kcard .kh b{font-size:17px}
.kcard table{width:100%;border-collapse:collapse}
.kcard th,.kcard td{padding:7px 10px;border-top:1px solid #eef2f7;text-align:left;font-size:13.5px}
.kcard th{background:#f8fafc;color:var(--muted);font-weight:600;font-size:12px}
.kcard .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.kcard tr.bad td{background:#fff1f2;color:#9f1239}
.kt{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
.kt th,.kt td{border:1px solid #e5e7eb;padding:6px 8px;text-align:left;vertical-align:top;font-size:13px}
.kt th{background:#e8eefb}
.kt .ev{display:block;border-radius:6px;padding:2px 6px;margin:2px 0;color:#fff;font-size:12px}
.kt .ev.bad{background:var(--red)!important}
.load{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;font-size:16px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
#pdfHost{position:fixed;left:-20000px;top:0}
.pane-off{content-visibility:hidden;height:0;overflow:hidden}
.subs-noprint{display:none;text-align:center;font-size:18px;padding:40px}
@media (max-width:600px){header h1{font-size:18px}.grid2{grid-template-columns:1fr}main{padding:10px}.cards{grid-template-columns:1fr}.gb ol{columns:1}}
@media print{
  @page{size:landscape;margin:7mm}
  .pane-off{display:none!important}
  body:not(.admin) .subs-view{display:none!important}
  body:not(.admin) .subs-noprint{display:block!important}
  nav,.hbtns,.bar .chip,.bar select,.bar .btn,.dl,.hint,footer,.toast,.legend,.gf{display:none!important}
  body{background:#fff}
  header{background:none;color:#000;padding:0 0 4px}
  .tw{box-shadow:none;max-height:none;overflow:visible}
  .les,.tt td.day,.tt th,.tt td.num,.gh,.kt .ev{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .les{animation:none}
}
</style>
</head>
<body>
<div class="load" id="loadScr" hidden>Кесте жүктелуде…</div>
<header>
  <div class="hwrap">
    <div>
      <h1 id="schoolName"></h1>
      <div class="sub" id="schoolSub"></div>
    </div>
    <div class="hbtns">
      <span class="sstate admonly" id="saveState"></span>
      <button class="hbtn admonly" id="confBtn"></button>
      <button class="hbtn admonly" id="soundBtn" title="Дыбыстық ескерту"></button>
      <button class="hbtn" id="langBtn" title="Тілді ауыстыру / Сменить язык"></button>
      <button class="hbtn" id="printBtn" onclick="window.print()">🖨 Басып шығару</button>
      <button class="hbtn" id="loginBtn"></button>
    </div>
  </div>
</header>
<nav><div class="nwrap">
  <button data-tab="all">📋 Жалпы кесте</button>
  <button data-tab="class">🎒 Сынып кестесі</button>
  <button data-tab="teacher">👩‍🏫 Мұғалім кестесі</button>
  <button data-tab="room">🚪 Кабинет кестесі</button>
  <button data-tab="clubs">🎨 Үйірмелер</button>
  <button data-tab="subs">🔁 Ауыстыру</button>
  <button data-tab="plan" class="admonly">📚 Оқу жоспары</button>
  <button data-tab="settings" class="admonly">⚙️ Баптаулар</button>
</div></nav>
<main id="main"></main>
<footer id="foot"></footer>
<div class="ov" id="ov" hidden><div class="md" id="md"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div id="pdfHost"></div>
<!-- Сайт іске қосылмаса — бос беттің орнына қатені және не істеу керегін көрсету -->
<script>
function bootFail(msg, line) {
  var m = document.getElementById('main');
  if (!m || m.getAttribute('data-ok')) return;
  var ls = document.getElementById('loadScr'); if (ls) ls.hidden = true;   // «жүктелуде» жазуы қатені жасырмасын
  msg = String(msg || 'белгісіз қате').replace(/&/g, '&amp;').replace(/</g, '&lt;');
  m.innerHTML = '<div style="max-width:720px;margin:30px auto;background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08)">' +
    '<h2 style="margin-top:0">⚠ Сайт іске қосылмады</h2><p>Қате: <b>' + msg + '</b>' + (line ? ' (жол ' + line + ')' : '') + '</p>' +
    '<p>Көбінесе бұл <b>index.html толық көшірілмегенде</b> болады. script.google.com → index.html → Ctrl+End: ең соңғы жол <b>&lt;/html&gt;</b> болуы керек. ' +
    'Болмаса: компьютердегі index.html файлын Блокнотпен ашып → Ctrl+A → Ctrl+C → Google-да Ctrl+A → Delete → Ctrl+V → Ctrl+S → ' +
    '«Развернуть → Управление развертываниями → ✏️ → Новая версия».</p><p style="color:#6b7280">Кесте деректері сақтаулы — ештеңе жоғалған жоқ.</p>' +
    '<details open><summary><b>Диагностика (скриншотын жіберіңіз)</b></summary><pre style="white-space:pre-wrap;font-size:12px;background:#f8fafc;padding:8px;border-radius:8px">' +
    String(diagScripts()).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></details></div>';
}
/* Браузерге келген әр бағдарлама бөлігін тексеру: бірінші функциясының аты және синтаксис қатесінің жолы */
function diagScripts() {
  var out = [], ss = document.scripts, n = 0;
  for (var i = 0; i < ss.length; i++) {
    var s = ss[i]; if (s.src || (s.type && s.type !== 'text/javascript')) continue;
    var t = s.textContent || ''; if (t.indexOf('bootFail') >= 0 && t.indexOf('diagScripts') >= 0) continue;
    n++;
    var m = /function\s+(\w+)/.exec(t), name = m ? m[1] : '-', line = 'Бөлік ' + n + ': ' + t.length + ' таңба, бірінші функция: ' + name;
    try { new Function(t); line += ' — OK'; }
    catch (e) {
      line += ' — ҚАТЕ: ' + e.message;
      var ls = t.split('\n');
      for (var k = 1; k <= ls.length; k++) {
        try { new Function(ls.slice(0, k).join('\n')); }
        catch (e2) {
          if (e2.message === e.message && !/end of input/i.test(e2.message)) {
            var bad = ls[k - 1], codes = [];
            for (var c = 0; c < bad.length; c++) { var cc = bad.charCodeAt(c); if (cc > 126 || cc < 32) codes.push('U+' + cc.toString(16)); }
            line += '\n    ' + k + '-жол: ' + bad.slice(0, 160) + (codes.length ? '\n    ерекше таңбалар: ' + codes.slice(0, 12).join(' ') : '');
            break;
          }
        }
      }
    }
    out.push(line);
  }
  out.push('readParams: ' + (typeof readParams) + ' · render: ' + (typeof render) + ' · start: ' + (typeof start));
  return out.join('\n');
}
window.addEventListener('error', function (e) { bootFail(e.message + (e.error && e.error.stack ? ' — ' + String(e.error.stack).split('\n').slice(0, 3).join(' / ') : ''), e.lineno); });
window.addEventListener('unhandledrejection', function (e) { bootFail('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
/* Сервер ұзақ жауап бермесе — «жүктелуде» күйінде қалып қоймау */

    return false;
  };
  const kidOverlap = (g, days, p) => g.kids.reduce((a, i) => { const ks = kidSlots(i, g); return a + days.filter(d => ks.has(d + '|' + p)).length; }, 0);
  const lbl = g => clubLabel(g);
  const dn = ds => ds.map(d => DAYS_ALL[d]).join(', ');

  // 1) Сейсенбі/бейсенбіден ауыстырылған топтар: педагог пен кабинет бос уақыт, қажет болса мектеп спортзалы
  const GYM = '126 - Спортзал';
  for (const g of CL.groups.filter(x => x.ov && /Баскетбол|Тхэквондо|Пионербол/.test(x.club))) {
    const n = g.days.length, combos = [];
    const pick = (arr, k) => k === 0 ? [[]] : arr.flatMap((v, i) => pick(arr.slice(i + 1), k - 1).map(r => [v, ...r]));
    for (let m = n; m >= 1; m--) pick([0, 2, 4].filter(d => d < D), m).forEach(c => combos.push(c));
    let best = null;
    for (const days of combos) for (const p of [9, 10, 11]) for (const room of [g.room, GYM]) {
      const hard = days.filter(d => teacherBusy(g, d, p)).length * 1000 + days.filter(d => roomBusy(room, d, p, g)).length * 1000;
      const sameClub = days.filter(d => CL.groups.some(o => o !== g && o.club === g.club && o.p === p && o.days.includes(d))).length;
      const sc = hard + (n - days.length) * 300 + kidOverlap(g, days, p) * 5 + sameClub * 40 + (room !== g.room ? 1 : 0) + (p !== g.p ? 1 : 0);
      if (!best || sc < best.sc) best = { sc, days, p, room };
    }
    if (best && (best.days.join() !== g.days.join() || best.p !== g.p || best.room !== g.room)) {
      log.push(`${lbl(g)}: ${dn(g.days)} ${g.p + 1}-сабақ, ${g.room} → ${dn(best.days)} ${best.p + 1}-сабақ, ${best.room}` + (best.days.length < n ? ` (педагогтың бос уақыты тек ${dn(best.days)} — аптасына ${best.days.length} рет)` : ''));
      g.days = best.days; g.p = best.p; g.room = best.room;
    }
  }
  // 2) Кабинет қайшылығы (үйірме мен үйірме): аз оқушысы бар топқа бос кабинет
  const allRooms = [...new Set(CL.groups.map(g => g.room).filter(r => /^(каб\.?\s*)?\d{3}$/i.test(String(r).trim())))];
  for (const g of [...CL.groups].sort((a, b) => a.kids.length - b.kids.length)) {
    if (!g.days.some(d => roomBusy(g.room, d, g.p, g))) continue;
    const free = allRooms.find(r => g.days.every(d => !roomBusy(r, d, g.p, g)));
    if (free) { log.push(`${lbl(g)}: ${g.room} кабинеті бос емес → ${free}`); g.room = free; }
  }
  // 3) Педагогтың үйірмесі мен сабағы бір уақытта: сабақты сол сыныптың басқа сабағымен орын ауыстыру
  for (const g of CL.groups.filter(x => x.tid)) for (const d of g.days) {
    for (const k in S.sched) {
      const [cid, d2, l2] = k.split('|'); if (+d2 !== d || +l2 !== g.p || !S.sched[k].some(x => x.s && x.t === g.tid)) continue;
      computeConflicts(); const before = C.list.length; let done = false;
      for (let l = 0; l < S.times.length && !done; l++) for (let dd = 0; dd < D && !done; dd++) {
        const k2 = cid + '|' + dd + '|' + l; if (k2 === k || S.sched[k2]?.some(x => subj(x.s)?.fixed) || S.sched[k].some(x => subj(x.s)?.fixed)) continue;
        const a = S.sched[k], b = S.sched[k2];
        if (b) S.sched[k] = b; else delete S.sched[k]; S.sched[k2] = a;
        computeConflicts();
        if (C.list.length < before) { done = true; log.push(`${cls(cid).name}: ${DAYS_ALL[d]} ${g.p + 1}-сабақтағы «${subj(a[0].s)?.name}» ${DAYS_ALL[dd]} ${l + 1}-сабаққа ауыстырылды (${teacher(g.tid).name} сол уақытта «${lbl(g)}» үйірмесін жүргізеді)`); }
        else { S.sched[k2] = b; if (!b) delete S.sched[k2]; S.sched[k] = a; }
      }
    }
  }
  // 4) Мектепке жазылмаған оқушыларды тізімге қосу
  (CL.noclub || []).forEach(k => { if (!CL.kids.some(x => !x.gone && x.cls === k.cls && x.name === k.name)) CL.kids.push({ ...k }); });
  if (CL.noclub?.length) log.push(`Үйірмеге жазылмаған ${CL.noclub.length} оқушы тізімге қосылды`);
  CL.noclub = [];
  // 4б) Сыныбы аты-жөнінің ішіне жазылып кеткен оқушылар (мыс. «Тегі Аты 2Н»): сыныбын анықтау, қайталанса — біріктіру
  const tk = s => kzn(s).split(/\s+/).filter(x => x.length >= 3).map(x => x.slice(0, 5));
  CL.kids.forEach((k, i) => {
    if (k.gone || kidGrade(k)) return;
    const m = /^(.*?)\s+(\d)\s*([A-Za-zА-ЯЁа-яё])\s*$/.exec(k.name); if (!m) return;
    const c = clubClassName(m[2] + m[3]), name = m[1].trim();
    const tks = tk(name);
    const dup = CL.kids.findIndex((o, j) => j !== i && !o.gone && o.cls === c && tk(o.name).some(t => tks.includes(t)));
    if (dup >= 0) {
      CL.groups.forEach(g => { if (g.kids.includes(i)) { g.kids = g.kids.filter(x => x !== i); if (!g.kids.includes(dup)) g.kids.push(dup); } });
      Object.assign(k, { gone: true, cls: '', cid: '' });
      log.push(`«${m[0]}» — ${c} сыныбындағы «${CL.kids[dup].name}» оқушысымен бір адам деп біріктірілді`);
    } else {
      Object.assign(k, { cls: c, cid: S.classes.some(x => x.id === 'c' + c) ? 'c' + c : '', name });
      log.push(`«${m[0]}» — сыныбы ${c}, аты-жөні «${name}» деп түзетілді`);
    }
  });
  // 5) Оқушы бір уақытта екі үйірмеде: сол үйірменің басқа тобына ауыстыру, болмаса біреуінен шығару
  let moved = 0, dropped = 0;
  CL.kids.forEach((k, i) => {
    if (k.gone) return;
    for (let guard = 0; guard < 6; guard++) {
      const mine = CL.groups.filter(g => g.kids.includes(i));
      let pair = null;
      for (const a of mine) for (const b of mine) if (a !== b && a.p === b.p && a.days.some(d => b.days.includes(d))) pair = pair || [a, b];
      if (!pair) break;
      let fixed = false;
      for (const g of [...pair].sort((x, y) => (y.ov ? 1 : 0) - (x.ov ? 1 : 0) || y.kids.length - x.kids.length)) {
        const alt = CL.groups.filter(o => o !== g && o.club === g.club && !o.kids.includes(i) && groupFits(o, k) && !placeholderT(o.teacher) && o.kids.length < CAP && kidFree(i, o, g))
          .sort((x, y) => x.kids.length - y.kids.length)[0];
        if (alt) { g.kids = g.kids.filter(x => x !== i); alt.kids.push(i); moved++; fixed = true; break; }
      }
      if (!fixed) { const g = pair.find(x => x.ov) || pair.sort((x, y) => y.kids.length - x.kids.length)[0]; g.kids = g.kids.filter(x => x !== i); dropped++; }
    }
  });
  if (moved) log.push(`${moved} оқушы бір уақытқа түскен үйірмесінің басқа тобына (басқа уақытқа) ауыстырылды`);
  if (dropped) log.push(`${dropped} жағдайда оқушы бір уақытқа түскен екі үйірменің біреуінен шығарылды (орнына басқа үйірме берілді)`);
  // 6) Әр оқушыны 3 түрлі үйірмеге дейін толтыру
  let added = 0; const short3 = [];
  CL.kids.forEach((k, i) => {
    if (k.gone || !kidGrade(k)) return;
    const clubs = () => new Set(CL.groups.filter(g => g.kids.includes(i)).map(g => g.club));
    while (clubs().size < 3) {
      const have = clubs();
      const c = CL.groups.filter(g => !have.has(g.club) && groupFits(g, k) && !placeholderT(g.teacher) && g.kids.length < CAP && kidFree(i, g))
        .sort((a, b) => (/«|"/.test(b.num) ? 1 : 0) - (/«|"/.test(a.num) ? 1 : 0) || a.kids.length - b.kids.length)[0];
      if (!c) { short3.push(k.cls + ' ' + k.name); break; }
      c.kids.push(i); added++;
    }
  });
  if (added) log.push(`${added} рет оқушы жаңа үйірмеге жазылды (әр оқушыда 3 түрлі үйірме болуы үшін)`);
  if (short3.length) log.push(`3 үйірмеге толтыру мүмкін болмады (бос уақыт/орын жоқ): ${short3.join(', ')}`);
  computeConflicts();
  return log;
}
/* Оқушыны 3 түрлі үйірмеге дейін толтыру: уақыты бос топ таңдалады */
function ensureThreeClubs(CL, names, cls4) {
  const grp = (club, num) => CL.groups.find(g => g.club === club && g.num === num);
  const cands = [grp('Speaking club', '4«E»'), grp('Шахматы', 'гр. 3'), grp('Шахматы', 'гр. 2'), grp('Шахматы', 'гр. 1')].filter(Boolean);
  for (const n of names) {
    const i = CL.kids.findIndex(k => !k.gone && k.cls === cls4 && k.name.startsWith(n)); if (i < 0) continue;
    const mine = () => CL.groups.filter(g => g.kids.includes(i));
    for (const g of cands) {
      if (new Set(mine().map(x => x.club)).size >= 3) break;
      const free = !mine().some(o => o.p === g.p && o.days.some(d => g.days.includes(d)));
      if (free && !mine().some(o => o.club === g.club)) g.kids.push(i);
    }
  }
}
/* 4G-ден қалған оқушылар да 4E-ге ауысты; 3 үйірмеге жетпесе — уақыты бос үйірмеге жазылады */
function clubFixes2(CL) {
  const grp = (club, num) => CL.groups.find(g => g.club === club && g.num === num);
  const cands = [grp('Speaking club', '4«E»'), grp('Шахматы', 'гр. 3'), grp('Шахматы', 'гр. 2'), grp('Шахматы', 'гр. 1')].filter(Boolean);
  for (const n of FIXDATA.fix2) {
    const i = CL.kids.findIndex(k => !k.gone && k.name.startsWith(n)); if (i < 0) continue;
    CL.kids[i].cls = '4E'; CL.kids[i].cid = S.classes.some(x => x.id === 'c4E') ? 'c4E' : '';
    const mine = () => CL.groups.filter(g => g.kids.includes(i));
    for (const g of cands) {
      if (new Set(mine().map(x => x.club)).size >= 3) break;
      const free = !mine().some(o => o.p === g.p && o.days.some(d => g.days.includes(d)));
      if (free && !mine().some(o => o.club === g.club)) g.kids.push(i);
    }
  }
  CL.fixV = 2;
}
function clubFixes1(CL) {
  const find = (c, name) => CL.kids.findIndex(k => !k.gone && k.cls === c && k.name === name);
  const setCls = (i, c) => { CL.kids[i].cls = c; CL.kids[i].cid = S.classes.some(x => x.id === 'c' + c) ? 'c' + c : ''; };
  const grp = (club, num, who) => CL.groups.find(g => g.club === club && g.num === num && (!who || String(g.who).startsWith(who)));
  const join = (g, i) => { if (g && !g.kids.includes(i)) g.kids.push(i); };
  let i = find('2F', FIXDATA.zh);
  if (i < 0) i = find('2A', FIXDATA.zh);
  if (i < 0) { CL.kids.push({ cls: '2A', cid: '', name: FIXDATA.zh }); i = CL.kids.length - 1; }
  setCls(i, '2A');
  const r3 = grp('Робототехника', 'гр. 3', '1–2');
  if (r3) r3.kids = r3.kids.filter(x => x !== i);
  join(grp('Шахматы', 'гр. 1'), i); join(grp('Турецкий', 'гр. 1'), i); join(grp('Робототехника', 'гр. 7', '1–2'), i);
  FIXDATA.g4toE.forEach(([n, nn]) => {
    const j = find('4G', n); if (j >= 0) { setCls(j, '4E'); if (nn) CL.kids[j].name = nn; } });
  const a = find('4G', FIXDATA.mok), b = find('4D', FIXDATA.mok);
  if (a >= 0 && b >= 0) { CL.groups.forEach(g => { g.kids = g.kids.filter(x => x !== a); }); Object.assign(CL.kids[a], { gone: true, cls: '', cid: '' }); }
  CL.fixV = 1;
}

function ensure() {
  S.subjects.forEach(s => { if (s.fixed === undefined) s.fixed = /^(О\+п|Түскі ас)/.test(s.name); });
  // қанық түстер: қызыл «қайшылық» белгісімен шатаспайтындай
  const RECOLOR = { 'Русский язык': '#8e24aa' };
  if (!S.v3) { S.subjects.forEach(s => { if (RECOLOR[s.name]) s.color = RECOLOR[s.name]; }); S.address = ''; S.v3 = true; }
  S.plan ??= {};
  S.classes.forEach(c => { if (!S.plan[c.id]) S.plan[c.id] = buildPlan(c.id); });
  S.af ??= { perDay: 2, scope: 'class' };
  S.extra ??= [];
  S.subs ??= { curators: [], list: [] };
  if (S.web && (!S.web.url || /netlify\.app/.test(S.web.url))) S.web.url = SITE_URL;   // сайт Netlify-дан GitHub Pages-ке көшті
  S.subtitle ??= SUBTITLE;
  // екі тіл: сыныптың тілі және пәннің орысша атауы (бір рет)
  if (!S.langV) {
    const lat = n => String(n).toUpperCase().replace(/\s+/g, '').replace(/[АВСЕКН]/g, ch => ({ А: 'A', В: 'B', С: 'C', Е: 'E', К: 'K', Н: 'H' })[ch]);
    S.classes.forEach(c => { c.lang ??= KZ_CLASSES.includes(lat(c.name)) ? 'kz' : 'ru'; });
    S.subjects.forEach(s => { const n = s.name; if (!s.ru && SUBJ_RU[n]) s.ru = SUBJ_RU[n]; if (SUBJ_KZ[n]) s.name = SUBJ_KZ[n]; });
    S.langV = 1;
  }
  if (!S.clubs && CLUBS_RAW) S.clubs = importClubs(CLUBS_RAW);
  if (S.clubs && BUILD !== 'parent') applyClubFixes(S.clubs);
}

/* ---------- Қайшылықтарды табу ----------
   1) Бір мұғалім/педагог бір уақытта әр түрлі жерде (бірлескен сабақ — бір пән + бір кабинет — қайшылық емес)
   2) Бір кабинетте бір уақытта әр түрлі мұғалімдердің сабағы (ортақ кабинеттерден басқа)
   3) Бір сыныпта бір уақытта топқа бөлінбеген екі сабақ
   4) Оқушы бір уақытта екі үйірмеде немесе үйірме уақытында сыныбының сабағы бар
   5) (қосымша) Бір күнде бір пән қайталанса */
function computeConflicts() {
  const les = {}, list = [], D = nDays(), L = S.times.length, gT = {}, gR = {}, gS = {}, sh = shared(), clubIdx = {};
  const add = (ids, msg, d, l) => { ids.forEach(i => (les[i] ??= []).push(msg)); list.push({ d, l, msg }); };
  const where = e => e.club ? e.label : e.ext ? e.label + ' (басқа сынып)' : cls(e.c).name + (e.g ? ' ' + e.g : '');
  for (const k in S.sched) {
    const [c, d, l] = k.split('|');
    if (!cls(c) || +d >= D || +l >= L) continue;
    const arr = S.sched[k];
    arr.forEach((x, i) => {
      if (!x.s) return;
      const e = { id: k + '#' + i, c, d: +d, l: +l, ...x };
      if (x.t) (gT[d + '|' + l + '|' + x.t] ??= []).push(e);
      if (nr(x.r) && !sh.has(nr(x.r))) (gR[d + '|' + l + '|' + nr(x.r)] ??= []).push(e);
      if (S.opt.noRepeat) (gS[c + '|' + d + '|' + x.s] ??= []).push(e);
    });
    const real = arr.filter(x => x.s);
    if (real.length > 1) {
      const gs = real.map(x => x.g || '');
      if (gs.includes('') || new Set(gs).size < gs.length)
        add(arr.map((x, i) => k + '#' + i), `Сыныпта бір уақытта бірнеше сабақ (топқа бөлінбеген): ${cls(c).name}`, +d, +l);
    }
  }
  (S.extra || []).forEach((x, i) => {
    if (x.d >= D || x.p >= L || !x.t) return;
    (gT[x.d + '|' + x.p + '|' + x.t] ??= []).push({ id: 'x' + i, ext: true, label: x.label, d: x.d, l: x.p, s: x.s, t: x.t, r: x.r });
  });
  const CL = S.clubs, ev = {};
  if (CL) CL.groups.forEach(g => g.days.forEach(d => {
    if (d >= D || g.p >= L) return;
    const e = { id: 'g:' + g.id + '|' + d, club: true, label: 'үйірме ' + clubLabel(g), d, l: g.p, s: 'club:' + g.id, t: g.tid || ('X:' + kzn(g.teacher)), tn: g.teacher, r: g.room };
    if (g.tid || !placeholderT(g.teacher)) (gT[d + '|' + g.p + '|' + e.t] ??= []).push(e);
    if (nr(g.room) && !sh.has(nr(g.room))) (gR[d + '|' + g.p + '|' + nr(g.room)] ??= []).push(e);
    (ev[d + '|' + g.p] ??= []).push(g);
    const cids = new Set(g.kids.map(i => CL.kids[i]?.cid).filter(Boolean));
    cids.forEach(cid => (clubIdx[cid + '|' + d + '|' + g.p] ??= []).push(g));
  }));
  for (const g in gT) {
    const es = gT[g]; if (es.length < 2) continue;
    const joint = !es.some(e => e.ext || e.club) && new Set(es.map(e => e.s)).size === 1 && new Set(es.map(e => nr(e.r))).size === 1;
    if (joint) continue;
    const tn = teacher(es[0].t)?.name || es.find(e => e.tn)?.tn;
    add(es.filter(e => !e.ext).map(e => e.id), `Мұғалім бір уақытта бірнеше жерде: ${tn || '?'} — ${es.map(where).join(', ')}`, es[0].d, es[0].l);
  }
  for (const g in gR) {
    const es = gR[g]; if (new Set(es.map(e => e.t)).size < 2) continue;
    add(es.map(e => e.id), `Кабинет бір уақытта бос емес: ${String(es[0].r).replace(/^каб\.?\s*/i, '')} — ${es.map(where).join(', ')}`, es[0].d, es[0].l);
  }
  for (const g in gS) {
    const es = gS[g]; if (new Set(es.map(e => e.l)).size < 2) continue;
    add(es.map(e => e.id), `Пән бір күнде қайталанады: ${subj(es[0].s)?.name} — ${cls(es[0].c).name} (${[...new Set(es.map(e => e.l + 1))].join(', ')}-сабақтар)`, es[0].d, -1);
  }
  if (CL) for (const key in ev) {
    const [d, p] = key.split('|').map(Number), gs = ev[key], seen = {};
    gs.forEach(g => g.kids.forEach(i => (seen[i] ??= []).push(g)));
    for (const i in seen) if (seen[i].length > 1) {
      const kd = CL.kids[i];
      add([...seen[i].map(g => 'g:' + g.id + '|' + d), 'k:' + i + '|' + d + '|' + p], `Оқушы бір уақытта екі үйірмеде: ${kd.cls} ${kd.name} — ${seen[i].map(clubLabel).join(', ')}`, d, p);
    }
    const byCls = {};
    gs.forEach(g => g.kids.forEach(i => { const cid = CL.kids[i]?.cid; if (cid) ((byCls[cid] ??= {})[g.id] ??= { g, ks: [] }).ks.push(i); }));
    for (const cid in byCls) {
      const k = cid + '|' + d + '|' + p, arr = cellL(k); if (!arr.length) continue;
      const items = Object.values(byCls[cid]);
      add([...S.sched[k].map((x, i) => k + '#' + i), ...items.map(x => 'g:' + x.g.id + '|' + d), ...items.flatMap(x => x.ks.map(i => 'k:' + i + '|' + d + '|' + p))],
        `Үйірме уақытында сабақ бар: ${cls(cid).name} (${arr.map(x => subj(x.s)?.name).join('/')}) — ${items.map(x => clubLabel(x.g) + ' (' + x.ks.length + ' оқушы)').join(', ')}`, d, p);
    }
  }
  list.sort((a, b) => a.d - b.d || a.l - b.l);
  C = { les, list, clubIdx };
}

    [880, 620, 880, 620].forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t = t0 + i * 0.18;
      o.type = 'square'; o.frequency.value = f;

      g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 0.17);
    });
  } catch (e) {}
}

/* ---------- Жылдам сайт (Netlify): index.html + d/<кілт>.json ----------
   Мұғалімдерге: …netlify.app/?t=КІЛТ (толық кесте), ата-анаға: …netlify.app/?k=КІЛТ (тек сол сынып). Деректер: <кілт>.json (сайттың түбінде).
   Кілтсіз сілтеме ештеңе көрсетпейді. Деректер файлдарының аты — кілттің өзі, сондықтан оларды табу мүмкін емес. */
function webEnsure(renew) {
  const tok = () => [...crypto.getRandomValues(new Uint8Array(7))].map(b => b.toString(16).padStart(2, '0')).join('');
  if (!S.web || renew) S.web = { url: S.web?.url || '', staff: tok(), classes: {} };
  S.web.staff ||= tok(); S.web.classes ??= {};
  S.classes.filter(c => c.grade > 0).forEach(c => { S.web.classes[c.name] ??= tok(); });
  return S.web;
}
const webBase = () => { const m = /^https?:\/\/[^?#\s]+/.exec(String(S.web?.url || '').trim()); return m ? m[0].replace(/^http:/, 'https:').replace(/\/(index\.html)?$/, '') : ''; };
function webLinks() {
  const base = webBase();
  if (!base || !S.web) return `<p class="hint">${T('Сайттың мекенжайын жазыңыз — сілтемелер осы жерде шығады.', 'Укажите адрес сайта — ссылки появятся здесь.')}</p>`;
  return linkRow('👩‍🏫 Мұғалімдерге', 'Мұғалімдерге арналған толық кесте', base + '/?t=' + S.web.staff) + '<hr style="border:0;border-top:1px solid var(--line)">' +
    sortedClasses().filter(c => S.web.classes[c.name]).map(c => linkRow(c.name + ' ата-аналарына' + (c.lang === 'ru' ? ' (орысша)' : ''), classWho(c), base + '/?k=' + S.web.classes[c.name])).join('');
}
/* Ата-анаға тек сол сыныптың деректері (Код.gs ішіндегі filterForClass_ сияқты) */
function filterForClass(S, cname) {
  const c = S.classes.find(x => x.name === cname), sched = {}, used = {};
  for (const k in S.sched) if (k.startsWith(c.id + '|')) { sched[k] = S.sched[k]; S.sched[k].forEach(x => { if (x.t) used[x.t] = 1; }); }
  const teachers = S.teachers.filter(t => used[t.id] || t.cls === c.id).map(t => ({ id: t.id, name: t.name, subjects: t.subjects, cls: t.cls === c.id ? c.id : '', room: '' }));
  let clubs = null;
  if (S.clubs) {
    const remap = {}, kids = [];
    S.clubs.kids.forEach((kd, i) => { if (!kd.gone && kd.cls === cname) { remap[i] = kids.length; kids.push(kd); } });
    const groups = S.clubs.groups.filter(g => g.kids.some(i => remap[i] !== undefined)).map(g => ({ ...clone(g), kids: g.kids.filter(i => remap[i] !== undefined).map(i => remap[i]) }));
    clubs = { date: S.clubs.date, map: S.clubs.map, kids, noclub: [], groups, report: [], fixV: S.clubs.fixV, fixLog: [] };
  }
  return { school: S.school, subtitle: S.subtitle, year: S.year, opt: S.opt, sharedRooms: S.sharedRooms, times: S.times, subjects: S.subjects,
    classes: [c], teachers, sched, plan: {}, extra: [], af: S.af, v3: true, langV: S.langV, clubs };
}

async function webZip() {
  if (!window.JSZip) { toast('ZIP кітапханасы жүктелмеді — бетті жаңартып көріңіз'); return; }
  const base = webBase(); if (!base) { toast('Алдымен Netlify сайтының мекенжайын жазыңыз (…netlify.app)'); return; }
  const W = webEnsure(false);
  let html = '';
  try { const r = await fetch(base + '/index.html', { cache: 'no-store' }); if (r.ok) html = await r.text(); } catch (e) {}
  if (!isStaticHtml(html)) html = await pickStaticFile();
  if (!html) return;
  // Netlify ZIP-ті жай файлдар тізімі ретінде күтеді: бөлек «d/» қалта жазбасынсыз, қысылған түрде
  const zip = new JSZip(), full = clone(S), _file = zip.file.bind(zip);
  zip.file = (name, data) => _file(name, data, { createFolders: false });
  delete full.web; delete full.siteUrl;
  zip.file('index.html', html);
  // '/' + '*' — Google жол ішіндегі «/*» белгісін түсініктеме деп қиып тастамауы үшін
  zip.file('_headers', '/' + '*\n  Access-Control-Allow-Origin: *\n  Cache-Control: no-cache\n');
  zip.file(W.staff + '.json', JSON.stringify(full));
  sortedClasses().filter(c => W.classes[c.name]).forEach(c => zip.file(W.classes[c.name] + '.json', JSON.stringify(filterForClass(S, c.name))));
  download(await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' }), 'sabak-netlify.zip');
  save(); const el = $('#wlinks'); if (el) el.innerHTML = webLinks();
  openModal(`<h3>✓ sabak-netlify.zip жүктелді</h3><ol>
    <li>Жүктеулер (Загрузки) қалтасындағы <b>sabak-netlify.zip</b> → оң жақ батырма → <b>«Извлечь все…» → «Извлечь»</b>.</li>
    <li><b>app.netlify.com</b> → сайтыңыз → <b>Deploys</b> бөлімі.</li>
    <li>Ашылған <b>sabak-netlify</b> қалтасын тінтуірмен беттің төменгі жағындағы «Drag and drop your site output folder here» алаңына апарып тастаңыз.</li>
    <li>«Published» деп шыққанда — дайын. Сілтемелер өзгермейді, бұрын жіберілгендері жаңа кестені көрсетеді.</li></ol>
    <div class="mbtns"><span style="flex:1"></span><button class="btn primary" data-close>Түсінікті</button></div>`);

/* ---------- Қолмен құру: жоспардан пәнді таңдап, ұяшықты басу ---------- */
let manual = false, brush = null;
const brushRow = () => brush && brush !== 'erase' ? planOf(curClass).rows.find(r => r.id === brush) : null;
function rowPlaced(cid, row) {
  const D = nDays(), L = S.times.length, ts = row.items.map(x => x.t).sort().join(','); let n = 0;
  for (let d = 0; d < D; d++) for (let l = 0; l < L; l++) {
    const a = cellL(cid + '|' + d + '|' + l);
    if (a.length && a.every(x => x.s === row.s) && a.map(x => x.t).sort().join(',') === ts) n++;
  }
  return n;
}
function hintFor(k) {
  const row = brushRow(); if (!manual || !row || cellL(k).length) return '';
  const [, d, l] = k.split('|'), sh = shared();
  if (row.items.some(x => x.t && busyAt(x.t, d, l, k))) return ' busy';
  for (const k2 in S.sched) {
    if (k2 === k) continue; const [, d2, l2] = k2.split('|'); if (d2 !== d || l2 !== l) continue;
    if (S.sched[k2].some(y => y.s && nr(y.r) && !sh.has(nr(y.r)) && row.items.some(x => nr(x.r) === nr(y.r)))) return ' busy';
  }
  return ' ok';
}
function manualPanel(c) {
  const P = planOf(c.id);
  const chips = P.rows.filter(r => r.s && subj(r.s)).map(r => {
    const s = subj(r.s), n = rowPlaced(c.id, r), who = r.items.map(x => teacher(x.t) ? short(teacher(x.t).name) : '—').join(' / ');
    return `<button class="chip brush${brush === r.id ? ' on' : ''}${n >= r.h ? ' full' : ''}" data-brush="${r.id}" style="${colStyle(s.color)}" title="${esc(s.name + ' · ' + who)}">
      <b>${esc(s.name)}</b><small>${esc(who)}${r.items.length > 1 ? ' · топқа бөлінген' : ''}</small><b>${n}/${+r.h || 0}</b></button>`;
  }).join('');
  return `<div class="manual"><b>✋ Қолмен құру.</b> <span class="hint">1) Төменнен пәнді таңдаңыз → 2) кестедегі ұяшықты басыңыз. Жасыл жиекті ұяшық — бос, сызықпен белгіленген — мұғалім немесе кабинет бос емес.
    Сандар: қойылғаны / жоспар бойынша. Тізімде жоқ пәнді «📚 Оқу жоспары» бөлімінде қосыңыз.</span>
    <div style="margin-top:6px">${chips}
      <button class="chip${brush === 'erase' ? ' on' : ''}" data-brush="erase">🧽 Өшіргіш</button></div>
    <div class="mbtns" style="margin-top:6px"><button class="btn sm danger" data-act="clearClass">${esc(c.name)} кестесін тазалау (бекітілгендерден басқа)</button>
      <button class="btn sm" data-act="manual">Дайын — режимнен шығу</button></div></div>`;
}
function paint(k) {
  if (brush === 'erase') { if (S.sched[k]) { delete S.sched[k]; commit(); } return; }
  const row = brushRow(); if (!row || !row.s) return;
  S.sched[k] = row.items.map(x => ({ s: row.s, t: x.t, r: x.r, g: row.items.length > 1 ? x.g : '' }));
  commit();
}

function clubEntry(g, d, sub) {
  const bad = cf('g:' + g.id + '|' + d);
  return `<div class="les club${bad ? ' conflict' : ''}" data-gshow="${g.id}" style="${colStyle(clubColor(g))}" title="${esc((bad || []).join('\n'))}">
    <div class="sn">${bad ? '⚠ ' : ''}🎨 ${esc(clubLabel(g))}</div><div class="tn">${esc(sub)}</div><div class="rn">${g.kids.length} оқушы</div></div>`;
}
/* Барлық мұғалімдер / кабинеттер — ортақ кесте */
let tMode = 'all', rMode = 'all', mxDay = -1;
function buildIndex() {
  const D = nDays(), L = S.times.length, T = {}, Rm = {};
  const put = (o, key, dl, e) => ((o[key] ??= {})[dl] ??= []).push(e);
  for (const k in S.sched) {
    const [c, d, l] = k.split('|');
    if (!cls(c) || +d >= D || +l >= L) continue;
    S.sched[k].forEach((x, i) => { if (!x.s) return; const e = { k, i, x, c }; if (x.t) put(T, x.t, d + '|' + l, e); if (nr(x.r)) put(Rm, nr(x.r), d + '|' + l, e); });
  }
  (S.extra || []).forEach(x => { if (x.d < D && x.p < L) put(T, x.t, x.d + '|' + x.p, { ext: x }); });
  (S.clubs?.groups || []).forEach(g => g.days.forEach(d => {
    if (d >= D || g.p >= L) return;
    if (g.tid) put(T, g.tid, d + '|' + g.p, { club: g, d });
    if (nr(g.room)) put(Rm, nr(g.room), d + '|' + g.p, { club: g, d });
  }));
  return { T, Rm };
}
function entryHTML(e, kind) {
  if (e.club) return clubEntry(e.club, e.d, kind === 'teacher' ? e.club.room : e.club.teacher);

  const x = kind === 'teacher' ? { ...e.x, t: '' } : { ...e.x, r: '' };
  return `<div data-k="${e.k}">${lesHTML(x, e.k + '#' + e.i, false, `<div class="tn"><b>${esc(cls(e.c).name)}</b></div>`)}</div>`;
}

/* ---------- Ауыстыру (замена) ----------
   Әкімші ауырған мұғалімді, басталатын күнді және неше оқу күні ауыратынын жазады. Сол күндердегі сабақтарына
   бос мұғалім автоматты түрде таңдалады (сол пәнді беретін, сол сыныптың жетекшісі, сол күні мектепте бар, ауыстыруы аз мұғалімге басымдық);
   бос мұғалім болмаса — куратор. Әкімші кез келген ұсынысты қолмен өзгерте алады. Мұғалімдер тек көреді, ата-аналарға көрсетілмейді. */
const ymd = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const parseYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const dmy = s => s.slice(8, 10) + '.' + s.slice(5, 7);
let subsOld = false;
/* Ауырған күндер: тек оқу күндері (дүйсенбі–жұма, сенбі баптауда қосулы болса) */
function absDates(a) {
  const out = [], dt = parseYmd(a.from);
  for (let guard = 0; out.length < (+a.days || 1) && guard < 90; guard++) {
    const wd = (dt.getDay() + 6) % 7; if (wd < nDays()) out.push({ date: ymd(dt), d: wd });
    dt.setDate(dt.getDate() + 1);
  }
  return out;
}
const subName = p => !p ? '' : p.startsWith('c:') ? p.slice(2) + ' (' + T('куратор', 'куратор') + ')' : teacher(p)?.name || '?';
const dayHas = (tid, d) => Object.keys(S.sched).some(k => +k.split('|')[1] === d && S.sched[k].some(x => x.s && x.t === tid));
function freeAt(d, l, slot, ctx) { return S.teachers.filter(t => !ctx.absent[slot.split('|')[0]]?.has(t.id) && !busyAt(t.id, d, l) && !ctx.used[slot]?.has(t.id)); }
function autoSub(r, d, slot, ctx) {
  const date = slot.split('|')[0], sid = r.x?.s;
  const score = t => (sid && t.subjects.includes(sid) ? 0 : 10) + (r.cid && t.cls === r.cid ? 0 : 3) + (dayHas(t.id, d) ? 0 : 5) + 2 * (ctx.load[date + '|' + t.id] || 0);
  const free = freeAt(d, r.l, slot, ctx).sort((p, q) => score(p) - score(q) || p.name.localeCompare(q.name, 'kk'));
  if (free.length) return free[0].id;
  const cur = (S.subs.curators || []).find(n => !ctx.used[slot]?.has('c:' + n));
  return cur ? 'c:' + cur : '';
}
/* Барлық ауыстырулар: әр ауырған мұғалімнің әр сабағы — кім ауыстырады */
function subPlan() {
  const items = [...S.subs.list].sort((a, b) => a.from.localeCompare(b.from)), ctx = { used: {}, load: {}, absent: {} }, rows = [];
  items.forEach(a => absDates(a).forEach(x => (ctx.absent[x.date] ??= new Set()).add(a.tid)));
  items.forEach(a => absDates(a).forEach(({ date, d }) => {
    const ls = [];
    for (const k in S.sched) {
      const [cid, dd, l] = k.split('|'); if (+dd !== d || !cls(cid) || +l >= S.times.length) continue;
      S.sched[k].forEach((x, i) => { if (x.s && x.t === a.tid) ls.push({ key: date + '|' + k + '#' + i, cid, l: +l, x }); });
    }
    (S.clubs?.groups || []).forEach(g => { if (g.tid === a.tid && g.days.includes(d)) ls.push({ key: date + '|g:' + g.id, l: g.p, club: g }); });
    ls.sort((p, q) => p.l - q.l).forEach(r => {
      const slot = date + '|' + r.l, manual = a.pick && r.key in a.pick;
      const pick = manual ? a.pick[r.key] : autoSub(r, d, slot, ctx);
      if (pick) { (ctx.used[slot] ??= new Set()).add(pick); ctx.load[date + '|' + pick] = (ctx.load[date + '|' + pick] || 0) + 1; }
      rows.push({ a, date, d, slot, ...r, pick, manual });
    });
  }));
  return { rows, ctx };
}

/* Ең қарапайым .xlsx (Excel) файлы: бір парақ, бірінші жол — қалың тақырып; JSZip арқылы жасалады */
function xlsxBlob(sheet, rows, widths) {
  const x = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const col = i => (i >= 26 ? String.fromCharCode(64 + Math.floor(i / 26)) : '') + String.fromCharCode(65 + i % 26);
  const data = rows.map((r, ri) => `<row r="${ri + 1}">${r.map((v, ci) => typeof v === 'number'
    ? `<c r="${col(ci)}${ri + 1}"${ri ? '' : ' s="1"'}><v>${v}</v></c>`
    : `<c r="${col(ci)}${ri + 1}" t="inlineStr"${ri ? '' : ' s="1"'}><is><t xml:space="preserve">${x(v)}</t></is></c>`).join('')}</row>`).join('');
  // XML басы бөліп жазылған — Google шаблоны оны өз белгісі деп оқымауы үшін
  const z = new JSZip(), h = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?' + '>';
  z.file('[Content_Types].xml', h + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>');
  z.file('_rels/.rels', h + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  z.file('xl/workbook.xml', h + `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${x(sheet).slice(0, 31)}" sheetId="1" r:id="rId1"/></sheets></workbook>`);
  z.file('xl/_rels/workbook.xml.rels', h + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  z.file('xl/styles.xml', h + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf/><xf fontId="1" applyFont="1"/></cellXfs></styleSheet>');
  z.file('xl/worksheets/sheet1.xml', h + `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${(widths || []).map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${data}</sheetData><autoFilter ref="A1:${col(rows[0].length - 1)}${rows.length}"/></worksheet>`);
  return z.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

function factCount(cid) {
  const D = nDays(), L = S.times.length, f = {};
  for (let d = 0; d < D; d++) for (let l = 0; l < L; l++) {
    const seen = new Set(); cellL(cid + '|' + d + '|' + l).forEach(x => { if (!seen.has(x.s)) { seen.add(x.s); f[x.s] = (f[x.s] || 0) + 1; } });
  }
  return f;
}

function autoFill(ids, perDay) {
  const D = nDays(), L = S.times.length, sh = shared();
  const base = {};
  for (const k in S.sched) {
    const c = k.split('|')[0];
    if (!ids.has(c)) base[k] = S.sched[k];
    else { const keep = S.sched[k].filter(x => subj(x.s)?.fixed); if (keep.length) base[k] = keep; }
  }
  const bT0 = new Set(), bR0 = new Set(), blocked = new Set();
  const markIn = (bT, bR, d, l, x) => { if (x.t) bT.add(d + '|' + l + '|' + x.t); if (nr(x.r) && !sh.has(nr(x.r))) bR.add(d + '|' + l + '|' + nr(x.r)); };
  for (const k in base) { const [, d, l] = k.split('|'); base[k].forEach(x => markIn(bT0, bR0, d, l, x)); }
  (S.extra || []).forEach(x => bT0.add(x.d + '|' + x.p + '|' + x.t));
  (S.clubs?.groups || []).forEach(g => g.days.forEach(d => { if (g.tid) bT0.add(d + '|' + g.p + '|' + g.tid); if (nr(g.room) && !sh.has(nr(g.room))) bR0.add(d + '|' + g.p + '|' + nr(g.room)); }));
  if (S.af.keepClubs !== false) for (const key in C.clubIdx) blocked.add(key);
  const items = [], load = {};
  for (const cid of ids) {
    const P = planOf(cid);
    for (const row of P.rows) {
      if (!row.s || subj(row.s)?.fixed) continue;
      for (let i = 0; i < (+row.h || 0); i++) items.push({ cid, row, max: Math.min(L, +P.max || L) });
      row.items.forEach(it => { if (it.t) load[it.t] = (load[it.t] || 0) + (+row.h || 0); });
    }
  }
  const prio = it => it.row.items.length * 100 + Math.max(0, ...it.row.items.map(x => load[x.t] || 0));
  let best = null; const t0 = Date.now();
  for (let a = 0; a < 40 && (Date.now() - t0 < 4000); a++) {
    const sched = { ...base }, bT = new Set(bT0), bR = new Set(bR0), miss = [];
    const order = items.map(it => ({ it, key: prio(it) + (a ? Math.random() * 60 : 0) })).sort((x, y) => y.key - x.key).map(x => x.it);
    for (const it of order) {
      const { cid, row, max } = it;
      const cnt = d => { let n = 0; for (let l = 0; l < L; l++) if (sched[cid + '|' + d + '|' + l]?.length) n++; return n; };
      const sc = d => { let n = 0; for (let l = 0; l < L; l++) if (sched[cid + '|' + d + '|' + l]?.some(x => x.s === row.s)) n++; return n; };
      const days = [...Array(D).keys()].filter(d => sc(d) < perDay).map(d => [d, cnt(d)]).filter(x => x[1] < max)
        .sort((x, y) => x[1] - y[1] || (a ? Math.random() - .5 : x[0] - y[0])).map(x => x[0]);
      let ok = false;
      for (const d of days) {
        for (let l = 0; l < L && !ok; l++) {
          const k = cid + '|' + d + '|' + l; if (sched[k]?.length || blocked.has(k)) continue;
          if (row.items.some(x => (x.t && bT.has(d + '|' + l + '|' + x.t)) || (nr(x.r) && !sh.has(nr(x.r)) && bR.has(d + '|' + l + '|' + nr(x.r))))) continue;
          sched[k] = row.items.map(x => ({ s: row.s, t: x.t, r: x.r, g: row.items.length > 1 ? x.g : '' }));
          sched[k].forEach(x => markIn(bT, bR, d, l, x)); ok = true;
        }
        if (ok) break;
      }
      if (!ok) miss.push(it);
    }
    if (!best || miss.length < best.miss.length) best = { sched, miss };
    if (!miss.length) break;
  }
  S.sched = clone(best.sched);
  const m = {}; best.miss.forEach(it => { const key = cls(it.cid).name + ' — ' + (subj(it.row.s)?.name || '?'); m[key] = (m[key] || 0) + 1; });
  return { placed: items.length - best.miss.length, total: items.length, miss: Object.entries(m) };
}
function runAutofill() {
  const c = cls(curClass), scope = S.af.scope, perDay = Math.max(1, +S.af.perDay || 2);
  const ids = new Set(S.classes.filter(x => scope === 'all' || (scope === 'grade' ? x.grade === c.grade : x.id === c.id)).map(x => x.id));
  const what = scope === 'all' ? 'барлық сыныптардың' : scope === 'grade' ? (GRADE_NAMES[c.grade] || c.grade + '-сыныптар') + ' параллелінің' : c.name + ' сыныбының';
  ask(`${what} қазіргі кестесі өшіріліп, оқу жоспары бойынша қайта құрылады. Бекітілген сабақтар орнында қалады. Жалғастырамыз ба?`, () => {
    const backup = clone(S.sched);
    const res = autoFill(ids, perDay);
    commit();
    openModal(`<h3>${res.miss.length ? '⚠ Кесте ішінара құрылды' : '✓ Кесте құрылды'}</h3>
      <p>Орналастырылған сабақтар: <b>${res.placed}</b> / ${res.total}</p>
      ${res.miss.length ? `<div class="warn">Орын табылмаған сабақтар (уақыт, мұғалім немесе кабинет бос емес):<ul class="ul">${res.miss.map(([k, n]) => `<li>${esc(k)}: ${n} сағат</li>`).join('')}</ul>
        Жоспарды (сағат санын, «күніне ең көп сабақ», мұғалімді) өзгертіп, қайта көріңіз немесе қолмен қойыңыз.</div>` : ''}
      <p class="hint">Қайшылықтар саны: ${C.list.length}</p>
      <div class="mbtns"><button class="btn danger" id="afUndo">↩ Болдырмау (бұрынғы кестені қайтару)</button><span style="flex:1"></span><button class="btn primary" data-close>Жабу</button></div>`);
    $('#afUndo').onclick = () => { S.sched = backup; closeModal(); commit(); toast('Бұрынғы кесте қайтарылды', true); };
  });
}

function render() {

  if (PARENT && tab !== 'class' && tab !== 'clubs') tab = 'class';
  renderHeader();
  const main = $('#main'), sc = window.scrollY, cur = shownPane(), tw = cur && cur.querySelector('.tw'), tsx = tw ? tw.scrollLeft : 0, tsy = tw ? tw.scrollTop : 0;
  main.setAttribute('data-ok', '1');
  // үлкен кестелер (жалпы, барлық мұғалімдер, барлық кабинеттер) есте сақталады — қайта ашқанда бірден шығады
  const key = paneKey(); let pane = key && paneCache.get(key), cached = !!pane;
  [...main.children].forEach(ch => { if (ch.classList.contains('pane') && [...paneCache.values()].includes(ch)) ch.classList.add('pane-off'); else ch.remove(); });
  if (!pane) {

    if (key) { paneCache.set(key, pane); if (paneCache.size > 6) { const [k0, p0] = paneCache.entries().next().value; paneCache.delete(k0); p0.remove(); } }
  }
  pane.classList.remove('pane-off'); if (pane.parentNode !== main) main.appendChild(pane);
  if (!cached) { const tw2 = pane.querySelector('.tw'); if (tw2) { tw2.scrollLeft = tsx; tw2.scrollTop = tsy; } }
  window.scrollTo(0, sc);
}
const paneCache = new Map(); let dataVer = 0;

/* ---------- Админ кіру ---------- */
async function sha256(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const localHash = () => { try { return localStorage.getItem(HKEY) || DEFAULT_PW_HASH; } catch (e) { return DEFAULT_PW_HASH; } };
function verifyPw(pw) {
  return SERVER ? new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).checkPassword(pw))
    : sha256(pw).then(h => h === localHash());
}
function openLogin() {
  openModal(`<h3>🔒 Админ ретінде кіру</h3>
    <form id="lgForm"><label>Құпиясөз<input type="password" id="lgPw" autocomplete="current-password" autofocus></label>
    <div class="warn" id="lgW"></div>
    <div class="mbtns"><span style="flex:1"></span><button type="button" class="btn" data-close>Болдырмау</button><button class="btn primary" type="submit" id="lgOk">Кіру</button></div></form>`);
  setTimeout(() => $('#lgPw')?.focus(), 30);
  $('#lgForm').onsubmit = async e => {
    e.preventDefault();
    const pw = $('#lgPw').value; if (!pw) return;
    $('#lgOk').disabled = true; $('#lgW').textContent = '';
    try {
      if (await verifyPw(pw)) {
        isAdmin = true; adminPw = pw; try { sessionStorage.setItem('sabak-adm', pw); } catch (e) {}
        closeModal(); computeConflicts(); prevConf = new Set(Object.keys(C.les)); render(); toast('✓ Админ режимі қосылды. Енді кестені өзгертуге болады.', true);
      } else { $('#lgW').textContent = 'Құпиясөз қате.'; $('#lgOk').disabled = false; }
    } catch (err) { $('#lgW').textContent = 'Тексеру мүмкін болмады: ' + (err && err.message || err); $('#lgOk').disabled = false; }
  };
}
function logout() {
  if (pending) pushServer();
  isAdmin = false; adminPw = ''; try { sessionStorage.removeItem('sabak-adm'); } catch (e) {}
  render(); toast('Админ режимінен шықтыңыз', true);
}
async function changePw() {
  const o = $('#pwOld').value, n = $('#pwNew').value, n2 = $('#pwNew2').value;
  if (n.length < 6) return toast('Жаңа құпиясөз кемінде 6 таңба болуы керек');
  if (n !== n2) return toast('Жаңа құпиясөздер сәйкес емес');
  try {
    if (SERVER) await new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).changePassword(o, n));
    else { if (await sha256(o) !== localHash()) throw new Error('Қазіргі құпиясөз қате'); localStorage.setItem(HKEY, await sha256(n)); }
    adminPw = n; try { sessionStorage.setItem('sabak-adm', n); } catch (e) {}
    $('#pwOld').value = $('#pwNew').value = $('#pwNew2').value = '';
    toast('✓ Құпиясөз өзгертілді', true);
  } catch (e) { toast((e && e.message) || String(e)); }
}

/* ---------- Ұяшықты өңдеу ---------- */
function candidates(c, sid) {
  const all = S.teachers.filter(t => t.subjects.includes(sid));
  const h = all.filter(t => t.cls === c.id); return h.length ? [...h, ...all.filter(t => t.cls !== c.id)] : all;
}
function busyAt(tid, d, l, exceptK) {
  for (const k in S.sched) { if (k === exceptK) continue; const [, d2, l2] = k.split('|'); if (+d2 === +d && +l2 === +l && S.sched[k].some(x => x.s && x.t === tid)) return true; }
  return (S.extra || []).some(x => x.t === tid && x.d === +d && x.p === +l) || (S.clubs?.groups || []).some(g => g.tid === tid && g.p === +l && g.days.includes(+d));
}
function openEdit(k) {
  const [cid, d, l] = k.split('|'), c = cls(cid); if (!c) return;
  let W = clone(cellL(k)); if (!W.length) W = [{ s: '', t: '', r: c.room || '', g: '' }];
  const rooms = roomList();
  const tOpts = (sid, sel) => {
    const yes = S.teachers.filter(t => t.subjects.includes(sid)), no = sortedTeachers().filter(t => !t.subjects.includes(sid));
    const o = t => `<option value="${t.id}"${t.id === sel ? ' selected' : ''}>${esc(t.name)}${t.cls && cls(t.cls) ? ' (' + esc(cls(t.cls).name) + ')' : ''}${busyAt(t.id, d, l, k) ? ' — бос емес' : ''}</option>`;
    return `<option value="">—</option>` + (yes.length ? `<optgroup label="Осы пәнді береді">${yes.map(o).join('')}</optgroup>` : '') + `<optgroup label="Басқа мұғалімдер">${no.map(o).join('')}</optgroup>`;
  };
  const draw = () => {
    $('#eL').innerHTML = W.map((x, i) => `<div class="eb" style="--c:${subj(x.s)?.color || '#cbd5e1'}" data-i="${i}">
      <div class="ebh"><span>${W.length > 1 ? (i + 1) + '-топ' : 'Сабақ'}</span>${W.length > 1 ? `<button class="x" data-del="${i}" title="Бұл топты жою">✕</button>` : ''}</div>
      <label class="full">Пән<select data-e="s"><option value="">— бос —</option>${S.subjects.map(s => `<option value="${s.id}"${s.id === x.s ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
      <label class="full">Мұғалім<select data-e="t">${tOpts(x.s, x.t)}</select></label>
      <label>Кабинет<input data-e="r" list="roomsDL" value="${esc(x.r || '')}"></label>
      <label>Топ (бөлінсе)<input data-e="g" value="${esc(x.g || '')}" placeholder="мыс. 1 группа"></label></div>`).join('');
    warn();
  };
  const warn = () => {
    const old = S.sched[k]; S.sched[k] = W.filter(x => x.s); computeConflicts();
    const msgs = [...new Set(S.sched[k].flatMap((x, i) => C.les[k + '#' + i] || []))];
    if (old) S.sched[k] = old; else delete S.sched[k]; computeConflicts();
    $('#eW').innerHTML = msgs.map(m => '⚠ ' + esc(m)).join('<br>');
  };
  openModal(`<h3>${esc(c.name)} · ${DAYS_ALL[d]} · ${+l + 1}-сабақ <small>${timeStr(+l)}</small></h3>
    <div id="eL"></div><datalist id="roomsDL">${rooms.map(r => `<option value="${esc(r[1])}">`).join('')}</datalist>
    <button class="btn sm" id="eAdd">+ Топқа бөлу / топ қосу</button>
    <div class="warn" id="eW"></div>
    <div class="mbtns"><button class="btn danger" id="eDel">Ұяшықты тазалау</button><span style="flex:1"></span>
      <button class="btn" data-close>Болдырмау</button><button class="btn primary" id="eOk">Сақтау</button></div>`);
  const box = $('#eL');
  box.addEventListener('change', e => {
    const el = e.target, i = +el.closest('.eb').dataset.i, x = W[i], f = el.dataset.e; if (!f) return;
    x[f] = el.value;
    if (f === 's') {
      if (!x.s) x.t = '';
      else if (!teacher(x.t)?.subjects.includes(x.s)) { const cd = candidates(c, x.s), t = cd.find(t => !busyAt(t.id, d, l, k)) || cd[0]; x.t = t ? t.id : ''; }
      draw(); return;
    }
    warn();
  });
  box.addEventListener('input', e => { const el = e.target; if (el.dataset.e === 'r' || el.dataset.e === 'g') { W[+el.closest('.eb').dataset.i][el.dataset.e] = el.value; warn(); } });
  box.addEventListener('click', e => { const b = e.target.closest('[data-del]'); if (b) { W.splice(+b.dataset.del, 1); if (W.length === 1 && /^\d+ (группа|топ)$/.test(W[0].g)) W[0].g = ''; draw(); } });
  $('#eAdd').onclick = () => { W.forEach((x, i) => { if (!x.g) x.g = (i + 1) + ' группа'; }); W.push({ s: W[0]?.s || '', t: '', r: '', g: (W.length + 1) + ' группа' }); draw(); };

  $('#eDel').onclick = () => { delete S.sched[k]; closeModal(); commit(); };
  draw();
}

/* Мұғалім жұмыстан шықса: сабақтарын басқа мұғалімге беру немесе мұғалімсіз қалдыру */
function removeTeacher(id) {
  const t = teacher(id); if (!t) return;
  let n = 0; for (const k in S.sched) S.sched[k].forEach(x => { if (x.t === id) n++; });
  const others = sortedTeachers().filter(x => x.id !== id);
  openModal(`<h3>Мұғалімді жою: ${esc(t.name)}</h3>
    <p>Бұл мұғалімнің кестеде <b>${n}</b> сабағы бар${t.cls && cls(t.cls) ? `, ол <b>${esc(cls(t.cls).name)}</b> сыныбының жетекшісі` : ''}.</p>
    <label>Сабақтарын кімге беру керек?<select id="rtTo"><option value="">— ешкімге (сабақтар мұғалімсіз қалады) —</option>
      ${others.map(x => `<option value="${x.id}">${esc(x.name)}${x.subjects.some(s => t.subjects.includes(s)) ? ' ✓ осы пәндерді береді' : ''}</option>`).join('')}</select></label>
    <p class="hint">Таңдалған мұғалімге барлық сабақтар, оқу жоспарындағы сағаттар, пәндер${t.cls ? ' және сынып жетекшілігі' : ''} беріледі. Жаңа мұғалім әлі тізімде болмаса, алдымен «+ Мұғалім қосу» арқылы қосыңыз.</p>
    <div class="mbtns"><span style="flex:1"></span><button class="btn" data-close>Болдырмау</button><button class="btn danger" id="rtOk">Жою</button></div>`);
  $('#rtOk').onclick = () => {
    const to = $('#rtTo').value, nt = teacher(to);
    for (const k in S.sched) S.sched[k].forEach(x => { if (x.t === id) x.t = to; });
    for (const c in S.plan) S.plan[c].rows.forEach(r => r.items.forEach(it => { if (it.t === id) it.t = to; }));
    S.extra = (S.extra || []).filter(x => x.t !== id);
    (S.clubs?.groups || []).forEach(g => { if (g.tid === id) g.tid = to; });
    if (nt) { t.subjects.forEach(s => { if (!nt.subjects.includes(s)) nt.subjects.push(s); }); if (t.cls && !nt.cls) nt.cls = t.cls; }
    S.teachers = S.teachers.filter(x => x.id !== id);
    closeModal(); commit(); toast(nt ? `✓ Сабақтары ${nt.name} мұғаліміне берілді` : '✓ Мұғалім жойылды, сабақтары мұғалімсіз қалды', true);
  };
}

function refreshClubs() {
  const done = txt => {
    try {
      const j = JSON.parse(txt); if (!j.ok || !j.payload || !Array.isArray(j.payload.groups)) throw new Error(j.error || 'деректер жоқ');
      S.clubs = importClubs(j.payload, S.clubs?.map); applyClubFixes(S.clubs); commit(); toast(`✓ Үйірмелер жаңартылды: ${S.clubs.groups.length} топ, ${S.clubs.kids.length} оқушы (${S.clubs.date})`, true);
    } catch (e) { toast('Үйірмелерді жаңарту мүмкін болмады: ' + e.message); }

function pdfData(kind, id) {

  let title = '', sub = [], lang = 'kz';

    sub = [hr && t2('Сынып жетекшісі: ', 'Классный руководитель: ') + hr.name, c.room && 'Кабинет: ' + c.room];
    for (let d = 0; d < D; d++) for (let l = 0; l < L; l++) {
      cellL(id + '|' + d + '|' + l).forEach(x => push(d, l, { s: x.s, name: nm(x, id), b: '', g: x.g, c: teacher(x.t) ? short(teacher(x.t).name) : '', r: x.r }));
      const gs = C.clubIdx[id + '|' + d + '|' + l];
      if (gs && gs.length) push(d, l, { name: t2('Үйірмелер', 'Кружки'), col: CLUB_COLOR, b: gs.length + t2(' топ', ' гр.'), c: '', r: '' });
    }
  } else if (kind === 'teacher') {
    const t = teacher(id); let n = 0; title = t.name;
    for (const k in S.sched) { if (!inRange(k)) continue; const [c, d, l] = k.split('|');
      S.sched[k].forEach(x => { if (x.s && x.t === id) { n++; push(+d, +l, { s: x.s, name: nm(x, c), b: cls(c).name, g: x.g, c: '', r: x.r }); } }); }
    (S.extra || []).forEach(x => { if (x.t === id && x.d < D && x.p < L) { n++; push(x.d, x.p, { s: x.s, b: x.label, c: '', r: x.r }); } });
    (S.clubs?.groups || []).forEach(g => { if (g.tid === id) g.days.forEach(d => { if (d < D && g.p < L) { n++; push(d, g.p, { ...clubE(g, g.kids.length + ' оқушы', ''), r: g.room }); } }); });

  } else {
    title = 'Кабинет ' + roomName(id);
    const owners = S.classes.filter(c => nr(c.room) === id).map(c => c.name);
    for (const k in S.sched) { if (!inRange(k)) continue; const [c, d, l] = k.split('|');
      S.sched[k].forEach(x => { if (x.s && nr(x.r) === id) push(+d, +l, { s: x.s, name: nm(x, c), b: cls(c).name, g: x.g, c: teacher(x.t) ? short(teacher(x.t).name) : '', r: '' }); }); }
    (S.clubs?.groups || []).forEach(g => { if (nr(g.room) === id) g.days.forEach(d => { if (d < D && g.p < L) push(d, g.p, clubE(g, g.teacher, '')); }); });
    lang = UI; sub = [owners.length && T('Сынып кабинеті: ', 'Кабинет класса: ') + owners.join(', ')];
  }

  return { title, sub: sub.filter(Boolean), map, rows: last + 1, D, lang };
}

const safeName = s => String(s).replace(/[\\/:*?"<>|]+/g, '_').trim();

  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);

async function renderInto(doc, el, first) {

  try {
    const cv = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', logging: false });
    if (!first) doc.addPage('a4', 'landscape');

async function makePdf(items, mode, zipName, oneName) {
  if (busy) return;
  if (!window.jspdf || !window.html2canvas || !window.JSZip) { toast('PDF кітапханасы жүктелмеді'); return; }
  if (!items.length) { toast('Жүктейтін ештеңе жоқ'); return; }
  const { jsPDF } = window.jspdf;
  busy = true;
  openModal(`<h3>📄 ${T('PDF дайындалуда…', 'PDF готовится…')}</h3><p id="pgTxt">0 / ${items.length}</p><div class="pbar"><i id="pgBar"></i></div>`);
  const prog = i => { $('#pgTxt').textContent = `${i} / ${items.length}`; $('#pgBar').style.width = (i / items.length * 100) + '%'; };
  try {
    if (mode === 'zip') {
      const zip = new JSZip();
      for (let i = 0; i < items.length; i++) {
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        await renderInto(doc, items[i].el(), true);
        zip.file(safeName(items[i].name) + '.pdf', doc.output('arraybuffer')); prog(i + 1);
      }
      download(await zip.generateAsync({ type: 'blob' }), safeName(zipName + '.zip'));
    } else {
      const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      for (let i = 0; i < items.length; i++) { await renderInto(doc, items[i].el(), i === 0); prog(i + 1); }
      download(doc.output('blob'), safeName(items.length === 1 ? items[0].name + ' — ' + oneName + '.pdf' : zipName + '.pdf'));
    }
    busy = false; closeModal(); toast(T('✓ PDF жүктелді (Жүктеулер / Downloads қалтасын қараңыз)', '✓ PDF скачан (папка «Загрузки» / Downloads)'), true);
  } catch (e) { busy = false; closeModal(); toast('PDF жасау кезінде қате: ' + e); }
}

/* Бір мәтінді аудару: толық сәйкес келсе — бүтіндей, ұзын сөйлемдер — мәтіннің ішінен де */
function trStr(s) {
  if (UI !== 'ru' || !s || !/[ӘәҒғҚқҢңӨөҰұҮүҺһІі]|[а-я]{3}/.test(s)) return s;
  const t = s.trim(); if (RU_UI[t]) return s.replace(t, RU_UI[t]);
  const cnt = /^(.*\S)(\s*\(\d+\))$/.exec(t); if (cnt && RU_UI[cnt[1]]) return s.replace(t, RU_UI[cnt[1]] + cnt[2]);   // «🎒 Сыныптар (27)»
  for (const [rx, to] of RU_RX) s = s.replace(rx, to);
  RU_LONG ??= Object.keys(RU_UI).filter(k => k.length >= 14).sort((a, b) => b.length - a.length);
  for (const k of RU_LONG) if (s.includes(k)) s = s.split(k).join(RU_UI[k]);
  return s;
}
/* Бет бөлігін аудару (кесте ұяшықтары мен тізімдердегі аттар өзгертілмейді) */
function trDom(root) {
  if (UI !== 'ru' || !root) return;
  if (root.nodeType === 3) { const v = trStr(root.nodeValue); if (v !== root.nodeValue) root.nodeValue = v; return; }
  if (root.nodeType !== 1 || root.closest('.les,.tchip,.kt,.gb,.kcard td,#pdfHost')) return;
  // кесте ұяшықтары мен тізімдердің ішіне мүлде кірмейміз (жылдамдық үшін)
  const SKIP = '.les,.tchip,.kt,.gb,.kcard td,option[value^="t"],option[value^="s"]';
  const w = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, { acceptNode: n => n.nodeType === 1 ? (n.matches(SKIP) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_SKIP) : NodeFilter.FILTER_ACCEPT });
  for (let n; (n = w.nextNode());) { const v = trStr(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; }
  [root, ...root.querySelectorAll('[placeholder],[title],optgroup[label]')].forEach(el => ['placeholder', 'title', 'label'].forEach(a => {
    const v = el.getAttribute && el.getAttribute(a); if (v) { const t = trStr(v); if (t !== v) el.setAttribute(a, t); } }));
}
/* Беттің кез келген жаңа бөлігі (бөлім, терезе, тізім) орысша режимде бірден аударылады */
new MutationObserver(ms => { if (UI === 'ru') ms.forEach(m => m.addedNodes.forEach(trDom)); })
  .observe(document.body, { childList: true, subtree: true });
